server {
    listen 80;
    server_name reservas.exemplo.edu.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name reservas.exemplo.edu.br;

    ssl_certificate     /etc/letsencrypt/live/reservas.exemplo.edu.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reservas.exemplo.edu.br/privkey.pem;

    root /var/www/reservas-front/browser;
    index index.html;

    client_max_body_size 2m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json text/csv image/svg+xml;

    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/reservas/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location = /up {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/reservas/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location ~* -[A-Za-z0-9_-]{8}\.(?:js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /var/log/nginx/reservas-front.access.log;
}
