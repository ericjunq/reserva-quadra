<a
  href="#conteudo"
  class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 focus:rounded-md focus:bg-white focus:px-4 focus:py-2 focus:font-semibold focus:text-azul"
>
  Pular para o conteúdo
</a>

<div class="flex min-h-dvh flex-col bg-slate-100">
  <header class="bg-azul text-white">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-4 py-3">
      <a routerLink="/admin" class="font-semibold">Reservas · Administração</a>
      <nav aria-label="Administração" class="flex flex-wrap items-center gap-4 text-sm">
        <a
          routerLink="/admin"
          routerLinkActive="underline"
          [routerLinkActiveOptions]="{ exact: true }"
          class="font-semibold hover:text-amarelo"
          >Painel</a
        >
        <a
          routerLink="/admin/minha-conta"
          routerLinkActive="underline"
          class="font-semibold hover:text-amarelo"
          >{{ admin()?.nome ?? 'Minha conta' }}</a
        >
        <button
          type="button"
          class="rounded-full px-3 py-1 font-semibold ring-1 ring-white/50 hover:bg-white/10"
          (click)="sair()"
        >
          Sair
        </button>
      </nav>
    </div>
  </header>

  <main id="conteudo" class="mx-auto w-full max-w-7xl flex-1 px-4 py-8">
    <router-outlet />
  </main>
</div>
